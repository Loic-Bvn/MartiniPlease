name: Deploy to GitHub Pages

# Hébergement piloté par version taguée :
#  - push d'un tag "vX.Y.Z" → déploiement auto de cette version (le cas normal)
#  - déclenchement manuel (Actions → Run workflow) avec un tag en paramètre →
#    permet de choisir explicitement quelle version x.y.z est publique,
#    y compris pour revenir en arrière sur une version antérieure (rollback)
#    sans avoir à créer un nouveau tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag à héberger (ex: v1.4.0) — doit déjà exister'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
          VITE_BARTENDER_PASSWORD: ${{ secrets.VITE_BARTENDER_PASSWORD }}
          VITE_APP_VERSION: ${{ inputs.version || github.ref_name }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: martiniplease.fr

      - name: Create GitHub Release
        # Uniquement pour un vrai push de tag. Un redéploiement manuel d'une
        # version existante ne doit pas re-créer/écraser sa release.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true