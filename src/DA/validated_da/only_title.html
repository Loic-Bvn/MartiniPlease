<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oberthür Cocktail Club - Brand Header</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Josefin+Sans:wght@400;600&family=Kalnia:wght@400;600&family=Karla:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        .menu-app.skin-luxe-bordeaux {
            --font-body: 'Karla', sans-serif;
            --font-subtitle: 'Josefin Sans', sans-serif;
            --font-display: 'Gloock', serif;
            --font-cocktail: 'Kalnia', serif;
            --bg: #f5e8e8;
            --bg-card: #fff8f7;
            --bg-raised: #f0dddd;
            --bg-input: #ecd4d5;
            --gold: #875521;
            --gold-button: #a5682b;
            --gold-dim: #71431c;
            --amber: #8f3543;
            --amber-surface: #8f3543;
            --text: #1a100c;
            --text-muted: #70505a;
            --text-dim: #806873;
            --border: #dec2c7;
            --border-mid: #d3aeb6;
            --radius-control: 3px;
            --radius-panel: 6px;
            --radius-dialog: 8px;
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 8px;
            --shadow-sm: 0 1px 3px rgba(26, 16, 12, 0.08);
            --shadow-md: 0 4px 12px rgba(26, 16, 12, 0.12);
            --shadow-lg: 0 10px 28px rgba(26, 16, 12, 0.16);
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 75% 55% at 0% 0%, rgba(143, 53, 67, 0.24), transparent 72%),
                radial-gradient(ellipse 70% 55% at 100% 15%, rgba(211, 174, 182, 0.36), transparent 72%),
                radial-gradient(ellipse 85% 55% at 50% 100%, rgba(196, 91, 107, 0.2), transparent 72%);
        }

        .dark .menu-app.skin-luxe-bordeaux {
            --bg: #1a100c;
            --bg-card: #4a1420;
            --bg-raised: #6b1f2e;
            --bg-input: #4a1420;
            --gold: #ebc070;
            --gold-button: #d9a441;
            --gold-dim: #ebc070;
            --amber: #c45b6b;
            --amber-surface: #c45b6b;
            --text: #f4eadb;
            --text-muted: #d4b8a2;
            --text-dim: #b49a86;
            --border: rgba(217, 164, 65, 0.34);
            --border-mid: rgba(217, 164, 65, 0.2);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.24);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.32);
            --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.4);
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 75% 55% at 0% 0%, rgba(196, 91, 107, 0.36), transparent 72%),
                radial-gradient(ellipse 70% 55% at 100% 15%, rgba(217, 164, 65, 0.18), transparent 72%),
                radial-gradient(ellipse 85% 55% at 50% 100%, rgba(107, 31, 46, 0.5), transparent 72%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .menu-app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: var(--text);
        }

        /* BLOC LOGO ALIGNÉ EXACTEMENT */
        .brand-block {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch; /* Force la sous-ligne à prendre 100% de la largeur du titre */
            width: max-content;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 400;
            line-height: 0.9;
            color: var(--text);
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        .brand-subtitle-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 0.6rem;
        }

        .brand-subtitle-wrapper span {
            font-family: var(--font-subtitle);
            font-weight: 600;
            font-size: clamp(0.75rem, 1.8vw, 1.45rem);
            text-transform: uppercase;
            color: var(--text);
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="menu-app skin-luxe-bordeaux">
        <header class="brand-block">
            <h1 class="brand-title">Oberthür</h1>
            <div class="brand-subtitle-wrapper">
                <span>C</span><span>O</span><span>C</span><span>K</span><span>T</span><span>A</span><span>I</span><span>L</span>
                <span>&nbsp;</span>
                <span>C</span><span>L</span><span>U</span><span>B</span>
            </div>
        </header>
    </div>

</body>
</html>
